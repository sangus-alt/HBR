<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ajouter un client</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.2/dist/tailwind.min.css" rel="stylesheet">
  <script src="/js/auth.js"></script>
</head>
<body onload="verifierConnexion()" class="bg-gray-100 p-6">
<div class="flex justify-between items-center bg-gray-200 p-3 mb-4">
  <h1 class="text-xl font-bold">Tableau de bord HBR</h1>
  <div class="flex items-center gap-4">
    <span id="nomUtilisateur" class="text-gray-700"></span>
    <button onclick="seDeconnecter()" class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600">
      Déconnexion
    </button>
  </div>
</div>

  <h1 class="text-3xl font-bold mb-4">Ajouter un client</h1>

  <form id="addClientForm" enctype="multipart/form-data" class="bg-white p-6 rounded shadow grid grid-cols-2 gap-4">
    <input name="nom" placeholder="Nom" required class="border p-2 rounded" />
    <input name="prenoms" placeholder="Prénoms" required class="border p-2 rounded" />
    <select name="sexe" class="border p-2 rounded">
      <option value="">Sexe</option>
      <option>Homme</option>
      <option>Femme</option>
    </select>
    <input type="date" name="dateNaissance" class="border p-2 rounded" />
    <input name="telephone" placeholder="Téléphone" required class="border p-2 rounded" />
    <input type="email" name="email" placeholder="Email" class="border p-2 rounded" />
    <input name="profession" placeholder="Profession" class="border p-2 rounded" />
    <input name="domicile" placeholder="Domicile" class="border p-2 rounded" />
    <input type="file" name="photo" accept="image/*" class="col-span-2" />
    <button type="submit" class="col-span-2 bg-green-600 text-white p-2 rounded hover:bg-green-700">Enregistrer</button>
  </form>

  <script src="/js/client.js"></script>
</body>
</html>
