<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Liste des clients</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.2/dist/tailwind.min.css" rel="stylesheet">
  <script src="/js/auth.js"></script>
</head>
<body onload="verifierConnexion(); chargerListeClients();" class="bg-gray-100 p-6">
<div class="flex justify-between items-center bg-gray-200 p-3 mb-4">
  <h1 class="text-xl font-bold">Tableau de bord HBR</h1>
  <div class="flex items-center gap-4">
    <span id="nomUtilisateur" class="text-gray-700"></span>
    <button onclick="seDeconnecter()" class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600">
      Déconnexion
    </button>
  </div>
</div>

  <h1 class="text-3xl font-bold mb-4">Liste des clients</h1>

  <div class="flex justify-between items-center mb-4">
    <input id="rechercheClient" onkeyup="filtrerClients()" placeholder="Rechercher par nom..." class="p-2 border rounded w-1/2" />
    <a href="add.html" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">➕ Ajouter</a>
  </div>

  <table class="w-full bg-white rounded shadow">
    <thead>
      <tr class="bg-gray-200 text-left">
        <th class="px-4 py-2">Nom</th>
        <th class="px-4 py-2">Prénoms</th>
        <th class="px-4 py-2">Téléphone</th>
        <th class="px-4 py-2">Actions</th>
      </tr>
    </thead>
    <tbody id="clientsBody"></tbody>
  </table>

  <div id="pagination" class="mt-4 flex justify-center gap-2"></div>

  <script src="/js/client.js"></script>
</body>
</html>
